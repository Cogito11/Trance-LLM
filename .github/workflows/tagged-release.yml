name: Tagged Release

# Builds trance.cu for Linux and Windows and publishes a proper GitHub
# Release, with both builds attached as zips, whenever a version tag
# (v12, v0.14, v1.2.3, ...) is pushed. Each zip contains the program, the
# example configs, and empty data/ and models/ folders.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            output_name: trance
            platform: linux-x86_64
            cuda_sub_packages: '["nvcc","cudart"]'
            cuda_non_cuda_sub_packages: '["libcublas","libcublas-dev"]'
            extra_flags: ''
          # Pinned to windows-2022 (not windows-latest): as of mid-2026,
          # windows-latest ships Visual Studio 2026, and nvcc's host-compiler
          # check only accepts up through VS 2022. windows-2022 stays on the
          # older, supported toolset regardless of where windows-latest moves.
          - os: windows-2022
            output_name: trance.exe
            platform: windows-x86_64
            cuda_sub_packages: '["nvcc","cudart","cublas","cublas_dev"]'
            cuda_non_cuda_sub_packages: '[]'
            # Statically link the MSVC runtime so users don't need the
            # Visual C++ Redistributable. Written -MT (not /MT) because
            # Git Bash rewrites a leading "/MT" into a filesystem path.
            extra_flags: '-Xcompiler -MT'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC dev environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Installs only the pieces we actually need (nvcc + cuBLAS) via the
      # 'network' method, which uses apt on Linux / a small web installer on
      # Windows. The 'local' method downloads a ~4GB monolithic .run/.exe
      # installer that tries to talk to a tty and fails under sudo on
      # hosted runners, so avoid it here.
      # Pinned to 12.6.0 rather than trusting the action's current default
      # (13.2.0): CUDA 13.x has a known broken header layout on Windows that
      # leaves out crt/host_config.h, which nvcc needs. 12.6.0 is a
      # well-established release without that problem.
      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda-toolkit
        with:
          cuda: '12.6.0'
          method: network
          sub-packages: ${{ matrix.cuda_sub_packages }}
          non-cuda-sub-packages: ${{ matrix.cuda_non_cuda_sub_packages }}

      - name: Build
        shell: bash
        # -arch=all-major embeds code for every major GPU generation (plus
        # PTX for newer ones) so the binary runs on GPUs other than the
        # one it was built for.
        run: nvcc -O3 -arch=all-major ${{ matrix.extra_flags }} -o ${{ matrix.output_name }} trance.cu -lcublas

      # Informational only, runs once (Linux leg) so it doesn't need a
      # Windows-compatible grep: flags it if TRANCE_VERSION wasn't bumped
      # to match the tag before tagging, without failing the build over it.
      - name: Compare TRANCE_VERSION against the pushed tag
        if: runner.os == 'Linux'
        shell: bash
        run: |
          built_version=$(grep -oP '(?<=#define TRANCE_VERSION ")[^"]+' trance.cu || echo "not found")
          echo "trance.cu TRANCE_VERSION: $built_version"
          echo "git tag:                  ${GITHUB_REF_NAME}"

      # Lays out the folder users will get, then zips it. The empty data/
      # and models/ folders are created here because git can't track empty
      # directories. Python's zipfile module is used because it exists on
      # both runners, keeps empty directories, and records the Linux
      # executable bit inside the zip (upload-artifact would otherwise
      # strip file permissions). The version is in the name so downloads
      # from different releases don't collide in a Downloads folder.
      - name: Package release zip
        shell: bash
        run: |
          pkg="trance-${GITHUB_REF_NAME}-${{ matrix.platform }}"
          mkdir -p "$pkg/data" "$pkg/models"
          cp "${{ matrix.output_name }}" "$pkg/"
          # Windows only: the exe links cuBLAS dynamically, so end users
          # without the CUDA Toolkit would get "cublas64_12.dll was not
          # found". Copy the two runtime DLLs (cuBLAS loads cublasLt too)
          # next to the exe; Windows checks the exe's folder first. `find`
          # is used instead of a hard-coded path because the toolkit's bin
          # layout differs between CUDA releases.
          if [ "$RUNNER_OS" = "Windows" ]; then
            cuda_dir=$(cygpath -u "$CUDA_PATH")
            for dll in cublas64_12.dll cublasLt64_12.dll; do
              src=$(find "$cuda_dir" -name "$dll" | head -n 1)
              if [ -z "$src" ]; then
                echo "::error::$dll not found under $cuda_dir"
                exit 1
              fi
              cp "$src" "$pkg/"
            done
          fi
          cp -r configs "$pkg/configs"
          cp README.md LICENSE "$pkg/" 2>/dev/null || true
          mkdir -p dist
          PY=$(command -v python || command -v python3)
          "$PY" -m zipfile -c "dist/${pkg}.zip" "$pkg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: trance-${{ matrix.platform }}
          path: dist/trance-${{ github.ref_name }}-${{ matrix.platform }}.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Trance ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true

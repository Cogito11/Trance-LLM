name: Rolling Release

# Builds Trance for Linux and Windows on every push to main, then republishes
# the builds as a single, continuously-updated pre-release tagged "rolling".
#
# Each download is a small zip with only what is needed to run, laid out as
# the folder the app expects:
#   Linux:    the AppImage (the desktop app), the `trance` engine for command
#             line use, and the configs/, data/ and models/ folders beside it.
#   Windows:  trance.exe with the cuBLAS DLLs, and the same three folders.
# Source code, tests and build tooling are deliberately left out; GitHub
# already attaches the source for every release.
#
# You can also run this by hand from the Actions tab (workflow_dispatch) to
# test changes; runs from branches other than main build but never publish.
on:
  push:
    branches: [main]
  workflow_dispatch:

# If two pushes land close together, only let the newer build publish.
concurrency:
  group: rolling-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            output_name: trance
            asset_name: trance-linux-x86_64
            cuda_sub_packages: '["nvcc","cudart"]'
            cuda_non_cuda_sub_packages: '["libcublas","libcublas-dev"]'
            extra_flags: ''
          # Pinned to windows-2022 (not windows-latest): as of mid-2026,
          # windows-latest ships Visual Studio 2026, and nvcc's host-compiler
          # check only accepts up through VS 2022. windows-2022 stays on the
          # older, supported toolset regardless of where windows-latest moves.
          - os: windows-2022
            output_name: trance.exe
            asset_name: trance-windows-x86_64
            cuda_sub_packages: '["nvcc","cudart","cublas","cublas_dev"]'
            cuda_non_cuda_sub_packages: '[]'
            # Statically link the MSVC runtime so users don't need the
            # Visual C++ Redistributable. Written -MT (not /MT) because
            # Git Bash rewrites a leading "/MT" into a filesystem path.
            extra_flags: '-Xcompiler -MT'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Activates cl.exe and the MSVC headers/libs nvcc needs as its host
      # compiler on Windows. No-op on Linux.
      - name: Set up MSVC dev environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Installs only the pieces we actually need (nvcc + cuBLAS) via the
      # 'network' method, which uses apt on Linux / a small web installer on
      # Windows. The 'local' method downloads a ~4GB monolithic .run/.exe
      # installer that tries to talk to a tty and fails under sudo on
      # hosted runners, so avoid it here.
      # Pinned to 12.6.0 rather than trusting the action's current default
      # (13.2.0): CUDA 13.x has a known broken header layout on Windows that
      # leaves out crt/host_config.h, which nvcc needs. 12.6.0 is a
      # well-established release without that problem.
      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda-toolkit
        with:
          cuda: '12.6.0'
          method: network
          sub-packages: ${{ matrix.cuda_sub_packages }}
          non-cuda-sub-packages: ${{ matrix.cuda_non_cuda_sub_packages }}

      - name: Build
        shell: bash
        # -arch=all-major embeds code for every major GPU generation (plus
        # PTX for newer ones) so the binary runs on GPUs other than the
        # one it was built for.
        run: nvcc -O3 -arch=all-major ${{ matrix.extra_flags }} -o ${{ matrix.output_name }} trance.cu -lcublas

      # Linux only: print where the cuBLAS libraries and their license text
      # ended up, so a packaging failure below is easy to diagnose.
      - name: Check CUDA runtime files (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "CUDA_PATH=$CUDA_PATH"
          ls -la "$CUDA_PATH/lib64" 2>/dev/null | grep -i cublas || echo "no cuBLAS under $CUDA_PATH/lib64"
          ls -d /usr/share/doc/libcublas* 2>/dev/null || echo "no libcublas docs under /usr/share/doc"
          ls "$CUDA_PATH/EULA.txt" 2>/dev/null || echo "no EULA.txt in the toolkit"

      # Linux only: the desktop app, as an AppImage. tools/build_appimage.py
      # bundles Python, Qt, the engine just built above and the cuBLAS
      # libraries from the toolkit installed above ($CUDA_PATH). The verify
      # step starts the packaged app and checks its safety protocols without
      # touching a GPU; AppImages are run with extract-and-run because hosted
      # runners have no FUSE.
      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          # squashfs-tools builds the image. The X11/xkb libraries are bundled into the AppImage, so they must be
          # present here. libgl1 and libegl1 are NOT bundled (they come from the user's graphics stack) but Qt
          # cannot even be imported without them, so the verify step below needs them on this runner.
          sudo apt-get install -y --no-install-recommends squashfs-tools libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libxcb-shape0 libxcb-xkb1 libxcb-keysyms1 libxcb-icccm4 libxkbcommon-x11-0 libxcb-cursor0 libxcb-image0 libxcb-render-util0 libxcb-util1
          python3 -m venv .venv-packaging
          .venv-packaging/bin/python -m pip install --disable-pip-version-check -r packaging/requirements.txt
          .venv-packaging/bin/python tools/download_appimage_tools.py
          .venv-packaging/bin/python tools/build_appimage.py --engine "$PWD/trance"
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen .venv-packaging/bin/python tools/verify_appimage.py

      # Lays out the folder users will get, then zips it. The empty data/
      # and models/ folders are created here because git can't track empty
      # directories. Python's zipfile module is used because it exists on
      # both runners, keeps empty directories, and records the Linux
      # executable bit inside the zip (upload-artifact would otherwise
      # strip file permissions).
      - name: Package release zip
        shell: bash
        run: |
          pkg="${{ matrix.asset_name }}"
          mkdir -p "$pkg/data" "$pkg/models"
          cp "${{ matrix.output_name }}" "$pkg/"
          cp -r configs "$pkg/configs"
          cp LICENSE "$pkg/"
          # Linux: the AppImage goes next to the engine and the folders, so
          # double-clicking it finds configs/, data/ and models/ beside it.
          if [ "$RUNNER_OS" = "Linux" ]; then
            appimage=$(ls dist/TranceLLM-*-x86_64.AppImage | head -n 1)
            if [ -z "$appimage" ]; then
              echo "::error::The AppImage was not built"
              exit 1
            fi
            cp "$appimage" "$pkg/"
          fi
          # Windows only: the exe links cuBLAS dynamically, so end users
          # without the CUDA Toolkit would get "cublas64_12.dll was not
          # found". Copy the two runtime DLLs (cuBLAS loads cublasLt too)
          # next to the exe; Windows checks the exe's folder first. `find`
          # is used instead of a hard-coded path because the toolkit's bin
          # layout differs between CUDA releases.
          if [ "$RUNNER_OS" = "Windows" ]; then
            cuda_dir=$(cygpath -u "$CUDA_PATH")
            for dll in cublas64_12.dll cublasLt64_12.dll; do
              src=$(find "$cuda_dir" -name "$dll" | head -n 1)
              if [ -z "$src" ]; then
                echo "::error::$dll not found under $cuda_dir"
                exit 1
              fi
              cp "$src" "$pkg/"
            done
          fi
          mkdir -p dist
          PY=$(command -v python || command -v python3)
          "$PY" -m zipfile -c "dist/${pkg}.zip" "$pkg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}.zip

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish rolling pre-release
        uses: ncipollo/release-action@v1
        with:
          tag: rolling
          name: Rolling build
          body: |
            Automatic build of the latest commit on `main`.

            Commit: ${{ github.sha }}

            **Linux** (`trance-linux-x86_64.zip`): extract it anywhere and
            run the AppImage. It uses the `configs/`, `data/` and `models/`
            folders next to it, so you can double-click it from a file
            manager. `trance` is the command-line engine. If the AppImage
            will not start, install FUSE 2 (`sudo apt install libfuse2t64`
            on Ubuntu 24.04) or run it with `--appimage-extract-and-run`.

            **Windows** (`trance-windows-x86_64.zip`): `trance.exe` with the
            cuBLAS DLLs, plus the same three folders. The CUDA Toolkit is not
            required.

            The desktop app needs the system graphics libraries `libGL`
            and `libEGL`, present on any desktop; on a minimal install:
            `sudo apt install libgl1 libegl1`.

            Both need an NVIDIA GPU with a current driver. Extract a model
            bundle into `models/` to use it. This pre-release is overwritten
            on every push to `main` and is not guaranteed to be stable. For
            versioned builds, see the tagged releases in this repository.
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          artifacts: dist/*
          token: ${{ secrets.GITHUB_TOKEN }}
